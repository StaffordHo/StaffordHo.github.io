<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#333">System Architecture — Clean Architecture + DDD</text>
  
  <!-- Frontend Layer -->
  <rect x="50" y="50" width="700" height="70" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="400" y="72" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1976d2">FRONTEND (Three.js + Vanilla JS)</text>
  <text x="150" y="98" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">3D Viewport</text>
  <text x="300" y="98" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">Joint Sliders</text>
  <text x="450" y="98" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">Algorithm Editor</text>
  <text x="600" y="98" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">LiDAR View</text>
  
  <!-- Arrow -->
  <line x1="400" y1="120" x2="400" y2="145" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="137" font-family="monospace" font-size="9" fill="#666">WebSocket + REST</text>
  
  <!-- Interface Layer -->
  <rect x="50" y="145" width="700" height="60" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="400" y="165" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#7b1fa2">INTERFACES (FastAPI)</text>
  <text x="150" y="190" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">REST API</text>
  <text x="300" y="190" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">WebSocket</text>
  <text x="450" y="190" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">Model Library</text>
  <text x="600" y="190" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">ROS Bridge</text>
  
  <!-- Arrow -->
  <line x1="400" y1="205" x2="400" y2="230" stroke="#666" stroke-width="1.5"/>
  
  <!-- Domain Layer -->
  <rect x="50" y="230" width="700" height="60" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="400" y="250" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#388e3c">DOMAIN (Pure Python — Zero Dependencies)</text>
  <text x="120" y="275" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">Robot</text>
  <text x="210" y="275" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">Joint</text>
  <text x="300" y="275" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">Drone</text>
  <text x="400" y="275" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">MobileRobot</text>
  <text x="510" y="275" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">World</text>
  <text x="620" y="275" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">ManipTask</text>
  
  <!-- Arrow -->
  <line x1="400" y1="290" x2="400" y2="315" stroke="#666" stroke-width="1.5"/>
  
  <!-- Infrastructure Layer -->
  <rect x="50" y="315" width="700" height="60" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="400" y="335" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#e65100">INFRASTRUCTURE (Adapters)</text>
  <text x="150" y="360" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">Physics Engine</text>
  <text x="310" y="360" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">URDF Parser</text>
  <text x="460" y="360" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">Drone Physics</text>
  <text x="630" y="360" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">AWS (future)</text>
  
  <!-- Arrow marker -->
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#666"/></marker></defs>
</svg>
