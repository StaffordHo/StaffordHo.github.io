<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0d1117"/>
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  
  <!-- Grid -->
  <g opacity="0.3" stroke="#30363d" stroke-width="0.5">
    <line x1="100" y1="350" x2="700" y2="350"/>
    <line x1="100" y1="300" x2="700" y2="300"/>
    <line x1="100" y1="250" x2="700" y2="250"/>
    <line x1="200" y1="150" x2="200" y2="400"/>
    <line x1="350" y1="150" x2="350" y2="400"/>
    <line x1="500" y1="150" x2="500" y2="400"/>
    <line x1="650" y1="150" x2="650" y2="400"/>
  </g>
  
  <!-- Robot arm -->
  <circle cx="350" cy="380" r="20" fill="#30363d"/>
  <line x1="350" y1="380" x2="350" y2="300" stroke="#4a4a50" stroke-width="12" stroke-linecap="round"/>
  <circle cx="350" cy="300" r="8" fill="#4a7ab5"/>
  <line x1="350" y1="300" x2="420" y2="230" stroke="#3a3a42" stroke-width="10" stroke-linecap="round"/>
  <circle cx="420" cy="230" r="7" fill="#5aab5a"/>
  <line x1="420" y1="230" x2="480" y2="280" stroke="#4a4a50" stroke-width="8" stroke-linecap="round"/>
  <circle cx="480" cy="280" r="6" fill="#ab5a4a"/>
  <rect x="472" y="275" width="16" height="10" fill="#cc3333" rx="2"/>
  
  <!-- Table with objects -->
  <rect x="520" y="320" width="150" height="8" fill="#8B5E3C" rx="2"/>
  <rect x="530" y="328" width="4" height="50" fill="#5C3A1E"/>
  <rect x="660" y="328" width="4" height="50" fill="#5C3A1E"/>
  <rect x="545" y="308" width="20" height="20" fill="#e63946" rx="2"/>
  <rect x="590" y="308" width="20" height="20" fill="#457b9d" rx="2"/>
  <circle cx="640" cy="315" r="10" fill="#2a9d8f"/>
  
  <!-- LiDAR points -->
  <g fill="#3fb950" opacity="0.7">
    <circle cx="200" cy="250" r="3"/><circle cx="180" cy="280" r="3"/>
    <circle cx="220" cy="220" r="3"/><circle cx="160" cy="310" r="3"/>
    <circle cx="250" cy="200" r="3"/><circle cx="270" cy="240" r="3"/>
    <circle cx="300" cy="180" r="3"/><circle cx="150" cy="350" r="3"/>
    <circle cx="500" cy="200" r="3"/><circle cx="550" cy="180" r="3"/>
    <circle cx="600" cy="220" r="3"/><circle cx="640" cy="250" r="3"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#58a6ff">🤖 RoboSim</text>
  <text x="400" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#8b949e">Open Robotics Simulation Platform</text>
  
  <!-- Tags -->
  <rect x="250" y="105" width="70" height="22" rx="11" fill="#1f6feb" opacity="0.3"/>
  <text x="285" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">URDF</text>
  <rect x="330" y="105" width="80" height="22" rx="11" fill="#238636" opacity="0.3"/>
  <text x="370" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3fb950">Three.js</text>
  <rect x="420" y="105" width="80" height="22" rx="11" fill="#8b5cf6" opacity="0.2"/>
  <text x="460" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#bc8cff">FastAPI</text>
  <rect x="510" y="105" width="60" height="22" rx="11" fill="#f85149" opacity="0.2"/>
  <text x="540" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f78166">240Hz</text>
  
  <!-- Bottom bar -->
  <rect x="40" y="410" width="720" height="1" fill="#30363d"/>
  <text x="60" y="430" font-family="monospace" font-size="11" fill="#8b949e">kirobuildfest.onrender.com</text>
  <text x="700" y="430" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Built with Kiro ⚡</text>
</svg>
