<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <rect width="800" height="300" fill="#fafafa"/>
  <text x="400" y="25" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#333">Supported Robot Types</text>
  
  <!-- Manipulator Arm -->
  <g transform="translate(100,60)">
    <rect x="-60" y="-10" width="120" height="200" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1976d2">Manipulator</text>
    <circle cx="0" cy="150" r="15" fill="#555"/>
    <line x1="0" y1="135" x2="0" y2="95" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="95" r="5" fill="#4a7ab5"/>
    <line x1="0" y1="90" x2="25" y2="55" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <circle cx="25" cy="55" r="4" fill="#5aab5a"/>
    <line x1="25" y1="51" x2="40" y2="75" stroke="#444" stroke-width="4" stroke-linecap="round"/>
    <rect x="35" y="72" width="12" height="6" fill="#cc3333" rx="1"/>
    <text x="0" y="178" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">7-9 DOF</text>
  </g>
  
  <!-- Quadruped -->
  <g transform="translate(280,60)">
    <rect x="-60" y="-10" width="120" height="200" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#388e3c">Quadruped</text>
    <rect x="-25" y="70" width="50" height="20" rx="4" fill="#444"/>
    <line x1="-20" y1="90" x2="-25" y2="130" stroke="#555" stroke-width="4" stroke-linecap="round"/>
    <line x1="-25" y1="130" x2="-20" y2="155" stroke="#555" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="90" x2="25" y2="130" stroke="#555" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="130" x2="20" y2="155" stroke="#555" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-20" cy="155" r="3" fill="#cc3333"/>
    <circle cx="20" cy="155" r="3" fill="#cc3333"/>
    <text x="0" y="178" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">12-16 DOF</text>
  </g>
  
  <!-- Mobile Robot -->
  <g transform="translate(460,60)">
    <rect x="-60" y="-10" width="120" height="200" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#e65100">Mobile Robot</text>
    <rect x="-30" y="80" width="60" height="35" rx="4" fill="#2d4059"/>
    <circle cx="-25" cy="122" r="8" fill="#222" stroke="#444" stroke-width="2"/>
    <circle cx="25" cy="122" r="8" fill="#222" stroke="#444" stroke-width="2"/>
    <polygon points="30,90 40,97 30,104" fill="#f85149"/>
    <text x="0" y="178" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">2-6 DOF</text>
  </g>
  
  <!-- Drone -->
  <g transform="translate(640,60)">
    <rect x="-60" y="-10" width="120" height="200" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#7b1fa2">Drone</text>
    <rect x="-12" y="90" width="24" height="12" rx="3" fill="#333"/>
    <line x1="-12" y1="96" x2="-35" y2="85" stroke="#555" stroke-width="2"/>
    <line x1="12" y1="96" x2="35" y2="85" stroke="#555" stroke-width="2"/>
    <line x1="-12" y1="96" x2="-35" y2="107" stroke="#555" stroke-width="2"/>
    <line x1="12" y1="96" x2="35" y2="107" stroke="#555" stroke-width="2"/>
    <ellipse cx="-35" cy="85" rx="12" ry="4" fill="#58a6ff" opacity="0.6"/>
    <ellipse cx="35" cy="85" rx="12" ry="4" fill="#3fb950" opacity="0.6"/>
    <ellipse cx="-35" cy="107" rx="12" ry="4" fill="#3fb950" opacity="0.6"/>
    <ellipse cx="35" cy="107" rx="12" ry="4" fill="#58a6ff" opacity="0.6"/>
    <text x="0" y="178" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">6-DOF Flight</text>
  </g>
  
  <!-- Bottom labels -->
  <text x="100" y="275" text-anchor="middle" font-family="system-ui" font-size="9" fill="#888">Franka, KUKA</text>
  <text x="280" y="275" text-anchor="middle" font-family="system-ui" font-size="9" fill="#888">Unitree A1, Laikago</text>
  <text x="460" y="275" text-anchor="middle" font-family="system-ui" font-size="9" fill="#888">TurtleBot, Racecar</text>
  <text x="640" y="275" text-anchor="middle" font-family="system-ui" font-size="9" fill="#888">Quadcopter, Hexacopter</text>
</svg>
